}

function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

function auditTrailHtml(c){
  let html = '<div style="margin-top:28px;border-top:1px solid var(--hairline);padding-top:16px;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  html += '<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:700;">Full event history</div>';
  html += '<div style="display:flex;gap:6px;">';
  html += '<button class="btn-export" data-action="export-audit" data-id="' + c.id + '">Export CSV</button>';
  html += '<button class="btn-export" data-action="export-audit-json" data-id="' + c.id + '">Export JSON</button>';
  html += '</div>';
  html += '</div>';
  c.events.forEach(evt => {
    let cls = 'hist-signoff';
    if(evt.type === 'sendback') cls = 'hist-sendback';
    else if(evt.type === 'resubmit') cls = 'hist-resubmit';
    else if(evt.type === 'rule_warning_overridden') cls = 'hist-warning';
    else if(evt.type === 'attachment_added') cls = 'hist-signoff';
    let label = '';
    switch(evt.type){
      case 'created': label = 'Case created'; break;
      case 'signoff': label = 'Signed off'; break;
      case 'sendback': label = 'Sent back'; break;
      case 'resubmit': label = 'Resubmitted' + (evt.fullChainRestart ? ' (full chain restart)' : ''); break;
      case 'escalated': label = 'Escalated to wound care'; break;
      case 'attachment_added': label = 'Attachment added: ' + escapeHtml(evt.attachmentName || ''); break;
      case 'rule_warning_overridden': label = 'Rule override (' + escapeHtml(evt.rule || '') + ')'; break;
      case 'visit_started': label = 'Visit started'; break;
      case 'visit_completed': label = 'Visit completed (' + (evt.durationMinutes||0) + ' min)'; break;
      case 'visit_amended': label = 'Visit amended'; break;
    }
    let stageName = '';
    if(evt.stageIndex !== null && evt.stageIndex !== undefined){
      const chain = c.chains.find(ch => ch.line === evt.chainLine);
      if(chain && chain.stages[evt.stageIndex]){
        const stageRole = ROLES.find(r => r.id === chain.stages[evt.stageIndex].role);
        if(stageRole) stageName = ' \u2014 ' + stageRole.title;
        if(evt.chainLine === 'wound_care') stageName += ' (wound care)';
      }
    }
    const bkp = backupLabel(evt);
    const bkpHtml = bkp ? ' <span class="backup-label">' + escapeHtml(bkp) + '</span>' : '';
    html += `<div class="stage-history-item ${cls}"><b>${escapeHtml(evt.actorName)} (${escapeHtml(evt.actorInitials)}) \u00b7 ${label}${stageName}</b>${bkpHtml}`;
    if(evt.note) html += `: ${escapeHtml(evt.note)}`;
    if(evt.type === 'resubmit'){
      if(evt.diagnosis) html += `<br><span style="font-size:11px;color:var(--ink-soft);">Diagnosis: ${escapeHtml(evt.diagnosis)}</span>`;
      if(evt.orderNote) html += `<br><span style="font-size:11px;color:var(--ink-soft);">Order note: ${escapeHtml(evt.orderNote)}</span>`;
    }
    html += ` <span class="hist-time">${fmtTime(evt.timestamp)}</span></div>`;
  });
  html += '</div>';
  return html;
}

function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el => {
    // Mobile person select
    if(el.tagName === 'SELECT' && el.dataset.action === 'switch-user-select'){
      el.addEventListener('change', () => {
        state.currentUserId = el.value;
        state.notifOpen = false;
        render();
      });
      return;
    }
    el.addEventListener('click', (e) => {
      if(el.dataset.action==='backdrop' && e.target !== el) return;
      if(el.dataset.action==='backdrop-resubmit' && e.target !== el) return;
      const action = el.dataset.action;
      if(action==='switch-user'){ state.currentUserId = el.dataset.uid; state.notifOpen = false; render(); }
      else if(action==='select-case'){
        state.selectedCaseId = el.dataset.id;
        state.mobileView = 'detail';
        render();
      }
      else if(action==='back-to-list'){ state.mobileView = 'list'; render(); }
      else if(action==='filter'){ state.showOnlyMine = el.dataset.val==='mine'; render(); }
      else if(action==='open-modal'){ if(curRole()==='doctor'){ state.showModal = true; render(); } }
      else if(action==='close-modal' || action==='backdrop'){ state.showModal = false; render(); }
      else if(action==='submit-referral'){ submitReferral(); }
      else if(action==='approve'){ actOnStage(el.dataset.id, +el.dataset.ci, +el.dataset.si, 'signoff'); }
      else if(action==='reject'){ actOnStage(el.dataset.id, +el.dataset.ci, +el.dataset.si, 'sendback'); }
      else if(action==='open-resubmit'){ state.resubmitModal = {caseId: el.dataset.id, ci: +el.dataset.ci, si: +el.dataset.si}; render(); }
      else if(action==='close-resubmit' || action==='backdrop-resubmit'){ state.resubmitModal = null; render(); }
      else if(action==='submit-resubmit'){ submitResubmit(); }
      else if(action==='escalate'){ escalateCase(el.dataset.id); }
      else if(action==='toggle-notifs'){ state.notifOpen = !state.notifOpen; render(); }
      else if(action==='close-notifs'){ state.notifOpen = false; render(); }
      else if(action==='mark-all-read'){
        readAt[state.currentUserId] = now();
        state.notifOpen = false;
        saveState();
        render();
      }
      else if(action==='notif-click'){
        // Mark this and all older notifications as read
        const nts = parseInt(el.dataset.nts, 10);
        const clickedTime = new Date(nts);
        const ra = readAt[state.currentUserId] || new Date(0);
        if(clickedTime > ra){ readAt[state.currentUserId] = clickedTime; saveState(); }
        state.selectedCaseId = el.dataset.case;
        state.mobileView = 'detail';
        state.notifOpen = false;
        render();
      }
      else if(action==='reset-demo'){ if(confirm('Reset all data to demo defaults?')) resetState(); }
      else if(action==='export-audit'){ exportAuditCsv(el.dataset.id); }
      else if(action==='export-audit-json'){ exportAuditJson(el.dataset.id); }
      else if(action==='start-dictation'){ startDictation(el.dataset.ta); }
      else if(action==='stop-dictation'){ stopDictation(); render(); }
      else if(action==='start-visit'){ startVisit(el.dataset.id); }
      else if(action==='complete-visit'){ completeVisit(el.dataset.id, el.dataset.vid); }
      else if(action==='toggle-amend'){ state.amendingVisitId = state.amendingVisitId === el.dataset.vid ? null : el.dataset.vid; render(); }
      else if(action==='cancel-amend'){ state.amendingVisitId = null; render(); }
      else if(action==='submit-amend'){ submitAmendment(el.dataset.id, el.dataset.vid); }
      else if(action==='open-lightbox'){ state.lightboxUrl = el.dataset.url; render(); }
      else if(action==='close-lightbox'){ state.lightboxUrl = null; render(); }
    });
  });

  // --- New referral modal: wound auto-suggest + file preview + wound warning ---
  setupModalWoundWarning('nf-diagnosis', 'nf-wound', 'nf-files', 'nf-file-preview', 'nf-wound-warning', 0);

  // --- Revise modal: file preview + wound warning ---
  setupModalWoundWarning('rs-diagnosis', 'rs-wound', 'rs-files', 'rs-file-preview', 'rs-wound-warning',
    state.resubmitModal ? (state.cases.find(x=>x.id===state.resubmitModal.caseId)||{attachments:[]}).attachments.filter(a=>a.type.startsWith('image/')).length : 0
  );

  // --- Nurse input validation: wire up textarea + file inputs to enable/disable approve ---
  document.querySelectorAll('textarea[data-nurse="1"]').forEach(ta => {
    const taId = ta.id;
    function updateNurseBtn(){
      const btn = document.getElementById('approve-btn-' + taId);
      const msg = document.getElementById('nurse-req-' + taId);
      const satisfied = nurseInputSatisfied(taId);
      if(btn) btn.disabled = !satisfied;
      if(msg) msg.style.display = satisfied ? 'none' : 'block';
    }
    ta.addEventListener('input', () => {
      // Track typed source
      if(ta.value.trim() && !noteSources[taId]) noteSources[taId] = ['typed'];
      else if(ta.value.trim() && noteSources[taId] && !noteSources[taId].includes('typed') && !noteSources[taId].includes('dictated')) noteSources[taId].push('typed');
      updateNurseBtn();
    });
    // File change
    const fileInput = document.getElementById('nurse-file-' + taId);
    if(fileInput){
      fileInput.addEventListener('change', async () => {
        const files = await readFiles(fileInput);
        nurseSignoffFiles[taId] = files;
        updateNurseBtn();
        // Update label
        const label = fileInput.closest('.btn-attach-file');
        if(label){
          label.classList.toggle('has-file', files.length > 0);
          label.querySelector('span').nextSibling.textContent = files.length ? ' ' + files.length + ' file' + (files.length > 1 ? 's' : '') : ' Attach file';
        }
      });
    }
    updateNurseBtn();
  });
}

function setupModalWoundWarning(diagId, woundId, filesId, previewId, warningId, existingImageCount){
  const diagInput = document.getElementById(diagId);
  const woundCheck = document.getElementById(woundId);
  const fileInput = document.getElementById(filesId);
  const preview = document.getElementById(previewId);
  const warning = document.getElementById(warningId);
  if(!diagInput || !woundCheck || !warning) return;

  function updateWarning(){
    const hasNewImages = fileInput && fileInput.files && Array.from(fileInput.files).some(f => f.type.startsWith('image/'));
    warning.style.display = (woundCheck.checked && !hasNewImages && existingImageCount === 0) ? 'block' : 'none';
  }

  let userChangedWound = false;
  diagInput.addEventListener('input', () => {
    if(!userChangedWound){ woundCheck.checked = isWoundDiagnosis(diagInput.value); }
    updateWarning();
  });
  woundCheck.addEventListener('change', () => { userChangedWound = true; updateWarning(); });
  if(fileInput){
    fileInput.addEventListener('change', () => {
      if(preview){
        preview.innerHTML = Array.from(fileInput.files).map(f => `<span class="file-tag">${escapeHtml(f.name)}</span>`).join('');
      }
      updateWarning();
    });
  }
  updateWarning();
}

/* ---------- Export ---------- */

function exportAuditCsv(caseId){
  const c = state.cases.find(x => x.id === caseId);
  if(!c) return;

  function csvCell(val){
    const s = String(val == null ? '' : val);
    if(s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  const timing = caseTiming(c);
  const headers = ['Timestamp','Event','Person','Initials','Role','Backup','Stage','Business Line','Note','Details'];
  const rows = [
    '# Case ' + c.id + ' - ' + c.patient + (timing ? ' - Timing: ' + timing.level + ' (' + fmtElapsed(timing.elapsedHours) + ' elapsed)' : ''),
    headers.join(','),
  ];

  c.events.forEach(evt => {
    const ts = evt.timestamp ? evt.timestamp.toISOString() : '';
    let label = evt.type;
    switch(evt.type){
      case 'created': label = 'Case created'; break;
      case 'signoff': label = 'Signed off'; break;
      case 'sendback': label = 'Sent back'; break;
      case 'resubmit': label = 'Resubmitted'; break;
      case 'escalated': label = 'Escalated to wound care'; break;
      case 'attachment_added': label = 'Attachment added'; break;
      case 'rule_warning_overridden': label = 'Rule override'; break;
      case 'visit_started': label = 'Visit started'; break;
      case 'visit_completed': label = 'Visit completed (' + (evt.durationMinutes||0) + ' min)'; break;
      case 'visit_amended': label = 'Visit amended'; break;
    }
    let stageName = '';
    if(evt.stageIndex !== null && evt.stageIndex !== undefined){
      const chain = c.chains.find(ch => ch.line === evt.chainLine);
      if(chain && chain.stages[evt.stageIndex]){
        const stageRole = ROLES.find(r => r.id === chain.stages[evt.stageIndex].role);
        if(stageRole) stageName = stageRole.title;
      }
    }
    const roleName = (ROLES.find(r => r.id === evt.role) || {}).title || evt.role || '';
    const bkp = evt.isBackup ? 'Yes' : '';
    const line = evt.chainLine === 'wound_care' ? 'Wound Care' : (evt.chainLine === 'home_health' ? 'Home Health' : '');
    let details = '';
    if(evt.type === 'resubmit'){
      const parts = [];
      if(evt.fullChainRestart) parts.push('Full chain restart');
      if(evt.diagnosis) parts.push('Diagnosis: ' + evt.diagnosis);
      if(evt.visitFrequency) parts.push('Frequency: ' + evt.visitFrequency);
      if(evt.orderNote) parts.push('Order note: ' + evt.orderNote);
      details = parts.join('; ');
    }
    if(evt.type === 'attachment_added') details = evt.attachmentName || '';
    if(evt.type === 'rule_warning_overridden') details = evt.rule || '';
    if(evt.type === 'visit_completed') details = 'Duration: ' + (evt.durationMinutes||0) + ' min; Notes: ' + (evt.notes||'');
    if(evt.type === 'visit_amended') details = 'Amendment: ' + (evt.note||'');

    rows.push([ts, label, evt.actorName, evt.actorInitials, roleName, bkp, stageName, line, evt.note || '', details].map(csvCell).join(','));
  });

  const csv = rows.join('\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = c.id + '_' + c.patient.replace(/\s+/g, '_') + '_audit.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportAuditJson(caseId){
  const c = state.cases.find(x => x.id === caseId);
  if(!c) return;
  const payload = {
    caseId: c.id,
    patient: c.patient,
    diagnosis: currentDiagnosis(c),
    visitFrequency: currentVisitFrequency(c),
    businessLines: c.chains.map(ch => ch.line),
    status: caseStatusLabel(c),
    createdAt: c.createdAt.toISOString(),
    exportedAt: now().toISOString(),
    events: c.events.map(evt => {
      const out = {};
      for(const k in evt){
        out[k] = evt[k] instanceof Date ? evt[k].toISOString() : evt[k];
      }
      return out;
    }),
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = c.id + '_' + c.patient.replace(/\s+/g, '_') + '_audit.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Actions (append-only) ---------- */

async function actOnStage(caseId, ci, si, type){
  const c = state.cases.find(x=>x.id===caseId);
  const noteEl = document.querySelector(`[data-note-for="${caseId}:${ci}:${si}"]`);
  const note = noteEl ? noteEl.value.trim() : '';
  const isNurseStage = c.chains[ci].stages[si].role === 'nurse';
  const taId = noteEl ? noteEl.id : null;

  if(type==='sendback' && !note){
    const errEl = document.querySelector(`[data-sendback-err="${caseId}:${ci}:${si}"]`);
    if(errEl) errEl.classList.add('visible');
    if(noteEl){ noteEl.parentElement.classList.add('has-error'); }
    return;
  }

  // Nurse approval gate: must have note OR file
  if(type === 'signoff' && isNurseStage && curRole() === 'nurse'){
    if(!nurseInputSatisfied(taId)) return;
  }

  const actor = actorFields(state.currentUserId);

  // Nurse: attach files if any
  let nurseNoteSource = null;
  if(isNurseStage && curRole() === 'nurse' && taId){
    const sources = getNurseNoteSources(taId);
    nurseNoteSource = sources.length === 1 ? sources[0] : sources;

    const files = nurseSignoffFiles[taId] || [];
    if(files.length > 0){
      const ts = now();
      files.forEach(f => {
        c.attachments.push({...f, addedByName:actor.actorName, addedByInitials:actor.actorInitials, addedAt:ts});
        appendEvent(c, {type:'attachment_added', ...actor, timestamp:ts, note:'Nurse sign-off attachment', chainLine:c.chains[ci].line, stageIndex:si, attachmentId:f.id, attachmentName:f.name});
      });
      delete nurseSignoffFiles[taId];
    }
    delete noteSources[taId];
  }

  // SOP 5.1: log rule override if head nurse approves wound case without photos
  if(type === 'signoff' && curRole() === 'head_nurse'){
    const isWound = currentIsWoundRelated(c);
    const noPhotos = caseImageCount(c) === 0;
    if(isWound && noPhotos){
      appendEvent(c, {
        type: 'rule_warning_overridden',
        ...actor,
        note: 'Approved wound referral without photos (SOP 5.1 override)',
        chainLine: c.chains[ci].line,
        stageIndex: si,
        rule: 'SOP_5_1_wound_photos',
      });
    }
  }

  const evt = {
    type,
    ...actor,
    note,
    chainLine: c.chains[ci].line,
    stageIndex: si,
  };
  if(nurseNoteSource) evt.noteSource = nurseNoteSource;
  appendEvent(c, evt);
  stopDictation();
  render();
}

async function submitResubmit(){
  const rm = state.resubmitModal;
  if(!rm) return;
  const c = state.cases.find(x => x.id === rm.caseId);
  const diagnosis = document.getElementById('rs-diagnosis').value.trim();
  const visitFrequency = document.getElementById('rs-freq').value.trim();
  const orderNote = document.getElementById('rs-note').value.trim();
  const fullChainRestart = document.getElementById('rs-clinical').checked;
  const isWound = document.getElementById('rs-wound').checked;

  // Inline validation
  let valid = true;
  [{id:'rs-diagnosis-field', err:'rs-diagnosis-err', val:diagnosis},
   {id:'rs-freq-field', err:'rs-freq-err', val:visitFrequency}].forEach(f => {
    const field = document.getElementById(f.id);
    const errEl = document.getElementById(f.err);
    if(!f.val){ if(field) field.classList.add('has-error'); if(errEl) errEl.classList.add('visible'); valid = false; }
    else { if(field) field.classList.remove('has-error'); if(errEl) errEl.classList.remove('visible'); }
  });
  if(!valid) return;

  const actor = actorFields(state.currentUserId);
  const fileInput = document.getElementById('rs-files');
  const files = await readFiles(fileInput);
  const ts = now();

  files.forEach(f => {
    c.attachments.push({...f, addedByName:actor.actorName, addedByInitials:actor.actorInitials, addedAt:ts});
    appendEvent(c, {type:'attachment_added', ...actor, timestamp:ts, note:'', chainLine:c.chains[rm.ci].line, stageIndex:rm.si, attachmentId:f.id, attachmentName:f.name});
  });

  appendEvent(c, {
    type: 'resubmit',
    ...actor,
    note: '',
    chainLine: c.chains[rm.ci].line,
    stageIndex: rm.si,
    diagnosis,
    visitFrequency,
    orderNote,
    fullChainRestart,
    isWoundRelated: isWound,
  });
  state.resubmitModal = null;
  render();
}

function escalateCase(caseId){
  const c = state.cases.find(x=>x.id===caseId);
  if(c.chains.some(ch=>ch.line==='wound_care')) return;
  const actor = actorFields(state.currentUserId);
  appendEvent(c, {
    type: 'escalated',
    ...actor,
    note: '',
    chainLine: 'wound_care',
    stageIndex: null,
  });
  c.chains.push({ line:'wound_care', stages: stageTemplate('wound_care') });
  saveState();
  render();
}

async function submitReferral(){
  const patient = document.getElementById('nf-patient').value.trim();
  const diagnosis = document.getElementById('nf-diagnosis').value.trim();
  const visitFrequency = document.getElementById('nf-freq').value.trim();
  const note = document.getElementById('nf-note').value.trim();
  const isWound = document.getElementById('nf-wound').checked;

  // Inline validation
  let valid = true;
  [{id:'nf-patient-field', err:'nf-patient-err', val:patient},
   {id:'nf-diagnosis-field', err:'nf-diagnosis-err', val:diagnosis},
   {id:'nf-freq-field', err:'nf-freq-err', val:visitFrequency},
   {id:'nf-note-field', err:'nf-note-err', val:note}].forEach(f => {
    const field = document.getElementById(f.id);
    const errEl = document.getElementById(f.err);
    if(!f.val){ if(field) field.classList.add('has-error'); if(errEl) errEl.classList.add('visible'); valid = false; }
    else { if(field) field.classList.remove('has-error'); if(errEl) errEl.classList.remove('visible'); }
  });
  if(!valid) return;

  const actor = actorFields(state.currentUserId);
  const fileInput = document.getElementById('nf-files');
  const files = await readFiles(fileInput);
  const ts = now();

  const c = { id: uid(), patient, diagnosis, createdAt: ts, chains:[{line:'home_health', stages: stageTemplate('home_health')}], events:[], attachments:[] };

  files.forEach(f => {
    c.attachments.push({...f, addedByName:actor.actorName, addedByInitials:actor.actorInitials, addedAt:ts});
    appendEvent(c, {type:'attachment_added', ...actor, timestamp:ts, note:'', chainLine:'home_health', stageIndex:0, attachmentId:f.id, attachmentName:f.name});
  });

  appendEvent(c, {type:'created', ...actor, timestamp:ts, note:'', chainLine:'home_health', stageIndex:0, diagnosis, visitFrequency, orderNote:note, isWoundRelated:isWound});
  appendEvent(c, {type:'signoff', ...actor, timestamp:ts, note, chainLine:'home_health', stageIndex:0});

  state.cases.unshift(c);
  state.selectedCaseId = c.id;
  state.showModal = false;
  state.mobileView = 'detail';
  saveState();
  render();
}

/* ---------- Visit actions (SOP §7) ---------- */

function startVisit(caseId){
  const c = state.cases.find(x => x.id === caseId);
  if(!c || !isCaseActive(c)) return;
  const user = curUser();
  // Gate: cannot start if open visit exists anywhere
  const blocked = openVisitAnywhere(user.id);
  if(blocked) return;
  const visitId = 'V' + Math.random().toString(36).slice(2,7).toUpperCase();
  appendEvent(c, {
    type: 'visit_started',
    ...actorFields(state.currentUserId),
    visitId,
    note: '',
    chainLine: c.chains[c.chains.length - 1].line,
    stageIndex: null,
  });
  render();
}

async function completeVisit(caseId, visitId){
  const c = state.cases.find(x => x.id === caseId);
  if(!c) return;
  const taId = 'visit-notes';
  const notesEl = document.getElementById(taId);
  const notes = notesEl ? notesEl.value.trim() : '';
  const satisfied = nurseInputSatisfied(taId);
  if(!satisfied){
    const errEl = document.getElementById('visit-notes-err');
    if(errEl) errEl.classList.add('visible');
    if(notesEl) notesEl.parentElement.classList.add('has-error');
    return;
  }
  const actor = actorFields(state.currentUserId);
  const startEvt = c.events.find(e => e.type === 'visit_started' && e.visitId === visitId);
  if(!startEvt) return;

  // Attach nurse files
  const files = nurseSignoffFiles[taId] || [];
  if(files.length > 0){
    const ts = now();
    files.forEach(f => {
      c.attachments.push({...f, addedByName:actor.actorName, addedByInitials:actor.actorInitials, addedAt:ts});
      appendEvent(c, {type:'attachment_added', ...actor, timestamp:ts, note:'Visit attachment', chainLine:c.chains[c.chains.length-1].line, stageIndex:null, attachmentId:f.id, attachmentName:f.name, visitId});
    });
    delete nurseSignoffFiles[taId];
  }

  const sources = getNurseNoteSources(taId);
  const noteSource = sources.length === 1 ? sources[0] : sources;
  delete noteSources[taId];

  const clockIn = startEvt.timestamp;
  const clockOut = now();
  const durationMinutes = Math.round((clockOut - clockIn) / 60000);
  appendEvent(c, {
    type: 'visit_completed',
    ...actor,
    visitId,
    clockIn,
    clockOut,
    durationMinutes,
    notes,
    noteSource,
    note: 'Visit completed (' + durationMinutes + ' min)',
    chainLine: c.chains[c.chains.length - 1].line,
    stageIndex: null,
  });
  stopDictation();
  render();
}

function submitAmendment(caseId, visitId){
  const c = state.cases.find(x => x.id === caseId);
  if(!c) return;
  const notesEl = document.getElementById('amend-notes');
  const note = notesEl ? notesEl.value.trim() : '';
  if(!note){
    const errEl = document.getElementById('amend-notes-err');
    if(errEl) errEl.classList.add('visible');
    if(notesEl) notesEl.parentElement.classList.add('has-error');
    return;
  }
  appendEvent(c, {
    type: 'visit_amended',
    ...actorFields(state.currentUserId),
    visitId,
    note,
    chainLine: c.chains[c.chains.length - 1].line,
    stageIndex: null,
  });
  state.amendingVisitId = null;
  render();
}

if(!loadState()) seedCases();
render();
</script>
</body>
